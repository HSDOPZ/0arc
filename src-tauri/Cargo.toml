[package]
name = "zeroarc"
version = "1.0.0"
description = "0arc — Personal Digital Archive"
authors = ["0arc"]
edition = "2021"

[lib]
name = "zeroarc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
