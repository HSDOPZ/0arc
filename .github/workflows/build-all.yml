name: Build 0arc (Windows, Linux, Android, iOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: [all, windows, linux, android, ios]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx @tauri-apps/cli icon public/icons/icon-1024.png
      - run: npm run build
      - run: npx @tauri-apps/cli build
      - name: Collect Windows installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "windows-output" -Force | Out-Null
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "windows-output/0arc-installer.exe"
          }
          if (Test-Path "src-tauri/target/release/0arc.exe") {
            Copy-Item "src-tauri/target/release/0arc.exe" "windows-output/0arc-portable.exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: 0arc-windows-exe
          path: windows-output/*
          if-no-files-found: warn

  build-linux:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx @tauri-apps/cli icon public/icons/icon-1024.png
      - run: npm run build
      - run: npx @tauri-apps/cli build
      - name: Collect Linux packages
        run: |
          mkdir -p linux-output
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} linux-output/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} linux-output/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: 0arc-linux-appimage
          path: linux-output/*
          if-no-files-found: warn

  build-android:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK platform, build tools, and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx @tauri-apps/cli icon public/icons/icon-1024.png
      - run: npm run build
      - name: Initialize Android project
        run: |
          npx @tauri-apps/cli android init --ci
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i '/<manifest/a \\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            grep -q "android.permission.CAMERA" "$MANIFEST" || sed -i '/<manifest/a \\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          fi
      - name: Build Android APK
        run: npx @tauri-apps/cli android build --debug --apk --ci
      - name: Collect Android APK
        run: |
          mkdir -p android-output
          find src-tauri/gen/android -name "*.apk" -exec cp {} android-output/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: 0arc-android-apk
          path: android-output/*
          if-no-files-found: warn
  build-ios:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show Apple build environment
        run: |
          xcodebuild -version
          swift --version
          rustc --version
          cargo --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate app icons
        run: npx @tauri-apps/cli icon public/icons/icon-1024.png

      - name: Build web frontend
        run: npm run build

      - name: Initialize Tauri iOS project
        run: npx @tauri-apps/cli ios init --ci

      - name: Build and package unsigned iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple

          echo "Available Xcode projects:"
          find . -maxdepth 1 -name "*.xcodeproj" -print

          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "::error::Tauri did not generate an Xcode project in src-tauri/gen/apple."
            exit 1
          fi

          xcodebuild -list -json -project "$PROJECT" | tee /tmp/0arc-xcode-project.json
          SCHEME=$(python3 -c 'import json; d=json.load(open("/tmp/0arc-xcode-project.json")); p=d.get("project", d); schemes=p.get("schemes", []); print(next((s for s in schemes if s.endswith("_iOS")), ""))')
          if [ -z "$SCHEME" ]; then
            echo "::error::Could not find the Tauri iOS scheme ending in _iOS."
            xcodebuild -list -project "$PROJECT"
            exit 1
          fi

          echo "Using Xcode project: $PROJECT"
          echo "Using iOS scheme: $SCHEME"
          mkdir -p build

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/0arc.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build/xcodebuild-archive.log

          APP_PATH=$(find build/0arc.xcarchive/Products/Applications -maxdepth 1 -type d -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Xcode archive completed but no .app bundle was found."
            find build/0arc.xcarchive -maxdepth 5 -print || true
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then
            echo "::error::The archived app is missing Info.plist."
            exit 1
          fi
          plutil -lint "$INFO_PLIST"

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$INFO_PLIST")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST")
          if [ -z "$EXECUTABLE" ] || [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "::error::The app's executable is missing."
            exit 1
          fi
          if [ "$BUNDLE_ID" != "com.zeroarc.app" ]; then
            echo "::error::Unexpected bundle identifier: $BUNDLE_ID"
            exit 1
          fi
          lipo -verify_arch arm64 "$APP_PATH/$EXECUTABLE"
          echo "Validated app bundle: $APP_PATH"
          echo "Bundle identifier: $BUNDLE_ID"
          echo "Executable: $EXECUTABLE"

          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/0arc.app
          (cd build && ditto -c -k --sequesterRsrc --keepParent Payload 0arc-unsigned.ipa)

          IPA="$PWD/build/0arc-unsigned.ipa"
          if [ ! -s "$IPA" ]; then
            echo "::error::IPA packaging produced an empty or missing file."
            exit 1
          fi
          unzip -t "$IPA"
          unzip -Z1 "$IPA" | grep -Eq '^Payload/0arc\.app/Info\.plist$'

          mkdir -p "$GITHUB_WORKSPACE/ios-output"
          cp "$IPA" "$GITHUB_WORKSPACE/ios-output/0arc-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/ios-output/0arc-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/ios-output/0arc-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: 0arc-ios-unsigned-ipa
          path: ios-output/0arc-unsigned.ipa
          if-no-files-found: error
