name: Build 0arc (Windows, Linux, Android, iOS)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: [all, windows, linux, android, ios]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx @tauri-apps/cli icon public/icons/icon-1024.png
      - run: npm run build
      - run: npx @tauri-apps/cli build
      - name: Collect Windows installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "windows-output" -Force | Out-Null
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "windows-output/0arc-installer.exe"
          }
          if (Test-Path "src-tauri/target/release/0arc.exe") {
            Copy-Item "src-tauri/target/release/0arc.exe" "windows-output/0arc-portable.exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: 0arc-windows-exe
          path: windows-output/*
          if-no-files-found: warn

  build-linux:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx @tauri-apps/cli icon public/icons/icon-1024.png
      - run: npm run build
      - run: npx @tauri-apps/cli build
      - name: Collect Linux packages
        run: |
          mkdir -p linux-output
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} linux-output/ \; 2>/dev/null || true
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} linux-output/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: 0arc-linux-appimage
          path: linux-output/*
          if-no-files-found: warn

  build-android:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK platform, build tools, and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx @tauri-apps/cli icon public/icons/icon-1024.png
      - run: npm run build
      - name: Initialize Android project
        run: |
          npx @tauri-apps/cli android init --ci
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            grep -q "android.permission.INTERNET" "$MANIFEST" || sed -i '/<manifest/a \\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            grep -q "android.permission.CAMERA" "$MANIFEST" || sed -i '/<manifest/a \\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          fi
      - name: Build Android APK
        run: npx @tauri-apps/cli android build --debug --apk --ci
      - name: Collect Android APK
        run: |
          mkdir -p android-output
          find src-tauri/gen/android -name "*.apk" -exec cp {} android-output/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: 0arc-android-apk
          path: android-output/*
          if-no-files-found: warn
  build-ios:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios
      - run: npm install
      - run: npx @tauri-apps/cli icon public/icons/icon-1024.png
      - run: npm run build
      - name: Initialize iOS project
        run: npx @tauri-apps/cli ios init --ci
      - name: Build unsigned iOS archive and IPA
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri/gen/apple

          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "No Xcode project was generated under src-tauri/gen/apple."
            exit 1
          fi

          xcodebuild -list -json -project "$PROJECT" > /tmp/0arc-xcode-project.json
          SCHEME=$(python3 -c 'import json; d=json.load(open("/tmp/0arc-xcode-project.json")); p=d.get("project", d); schemes=p.get("schemes", []); print(next((s for s in schemes if s.endswith("_iOS")), schemes[0] if schemes else ""))')
          if [ -z "$SCHEME" ]; then
            echo "Could not find a build scheme in $PROJECT."
            xcodebuild -list -project "$PROJECT"
            exit 1
          fi

          echo "Building iOS scheme: $SCHEME"
          mkdir -p build
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -archivePath build/0arc.xcarchive \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP_PATH=$(find build/0arc.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Xcode archive completed but no .app was found inside the archive."
            exit 1
          fi

          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/0arc.app
          (cd build && ditto -c -k --sequesterRsrc --keepParent Payload 0arc-unsigned.ipa)

          mkdir -p "$GITHUB_WORKSPACE/ios-output"
          cp build/0arc-unsigned.ipa "$GITHUB_WORKSPACE/ios-output/"
      - uses: actions/upload-artifact@v4
        with:
          name: 0arc-ios-ipa
          path: ios-output/*
          if-no-files-found: warn

